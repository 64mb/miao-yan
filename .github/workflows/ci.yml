name: CI

on:
  push:
    branches: [main]
    # Without the tags trigger no run is ever created for tag pushes, so the
    # version-consistency job (gated on refs/tags/V*) was dead code and the
    # V3.5.1-class drift guard never actually ran.
    tags: ["V*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    name: macOS build
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve SPM dependencies
        run: |
          xcodebuild \
            -project MiaoYan.xcodeproj \
            -scheme MiaoYan \
            -resolvePackageDependencies

      - name: Build macOS app (Debug)
        run: |
          set -o pipefail
          xcodebuild \
            -project MiaoYan.xcodeproj \
            -scheme MiaoYan \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify --renderer github-actions || \
          xcodebuild \
            -project MiaoYan.xcodeproj \
            -scheme MiaoYan \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project MiaoYan.xcodeproj \
            -scheme MiaoYan \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions || \
          xcodebuild test \
            -project MiaoYan.xcodeproj \
            -scheme MiaoYan \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  build-ios:
    name: iOS build
    # MiaoYanMobile uses iOS 26 SwiftUI APIs (glassEffect / Liquid Glass).
    # Those symbols only ship in Xcode 26 SDKs, so this job requires the
    # macos-26 runner image. If macos-26 is unavailable the job will fail
    # with a clear runner-not-found error; switch to advisory or skip
    # rather than downgrading the iOS code.
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build iOS app (Debug)
        run: |
          xcodebuild \
            -project MiaoYan.xcodeproj \
            -scheme MiaoYanMobile \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

  android-fast:
    name: Android tests, lint and release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: MiaoYanAndroid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android build tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'

      - name: Test, lint and assemble minified APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleLocalRelease

  android-device:
    name: Android device tests and minified launch
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: android-fast
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Install native build tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run device suite and launch minified APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: bash scripts/ci-android-device.sh

      - name: Upload Android device test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-results
          path: |
            MiaoYanAndroid/app/build/outputs/androidTest-results/connected/
            MiaoYanAndroid/app/build/reports/androidTests/connected/
          if-no-files-found: warn

  lint:
    name: Lint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --baseline .swiftlint-baseline.json --reporter github-actions-logging

      - name: Install swift-format
        run: brew install swift-format

      # Project `.swift-format` disables the rules the codebase deliberately
      # violates (PascalCase enum cases, retroactive NSTextStorageDelegate,
      # block comments, forEach). Remaining warnings are real and gate CI.
      - name: Run swift-format
        run: swift-format lint --recursive . --strict

  release-notes-smoke:
    name: Release notes smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Render appcast description HTML
        run: bash scripts/release-ci/notes_to_html.sh .github/RELEASE_NOTES.md > /tmp/description.html

      - name: Render GitHub release body
        run: bash scripts/release-ci/render_release_body.sh .github/RELEASE_NOTES.md > /tmp/release-body.html

      - name: Sanity check rendered outputs
        run: |
          test -s /tmp/description.html
          test -s /tmp/release-body.html

  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: startsWith(github.ref, 'refs/tags/V')
    steps:
      - uses: actions/checkout@v4

      - name: Verify MARKETING_VERSION == CURRENT_PROJECT_VERSION == tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          STRIPPED="${TAG#V}"
          # Every target/config must match the tag, not just the first
          # occurrence: the V3.5.1 / #524 drift was a single target out of
          # sync. Collect the distinct values and assert each equals the tag.
          MARKETING=$(grep 'MARKETING_VERSION = ' MiaoYan.xcodeproj/project.pbxproj | sed -E 's/.*MARKETING_VERSION = ([^;]+);.*/\1/' | tr -d ' ' | sort -u)
          PROJECT=$(grep 'CURRENT_PROJECT_VERSION = ' MiaoYan.xcodeproj/project.pbxproj | sed -E 's/.*CURRENT_PROJECT_VERSION = ([^;]+);.*/\1/' | tr -d ' ' | sort -u)
          ANDROID=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' MiaoYanAndroid/app/build.gradle.kts | sort -u)
          echo "tag=${STRIPPED}"
          printf 'MARKETING_VERSION values:\n%s\n' "${MARKETING}"
          printf 'CURRENT_PROJECT_VERSION values:\n%s\n' "${PROJECT}"
          printf 'Android versionName values:\n%s\n' "${ANDROID}"
          fail=0
          while IFS= read -r v; do
            [ -n "${v}" ] || continue
            if [ "${v}" != "${STRIPPED}" ]; then
              echo "::error::MARKETING_VERSION ${v} != tag ${STRIPPED}. See AGENTS.md V3.5.1 / #524."
              fail=1
            fi
          done <<< "${MARKETING}"
          while IFS= read -r v; do
            [ -n "${v}" ] || continue
            if [ "${v}" != "${STRIPPED}" ]; then
              echo "::error::CURRENT_PROJECT_VERSION ${v} != tag ${STRIPPED}. See AGENTS.md V3.5.1 / #524."
              fail=1
            fi
          done <<< "${PROJECT}"
          if [ "${ANDROID}" != "${STRIPPED}" ]; then
            echo "::error::Android versionName ${ANDROID} != tag ${STRIPPED}."
            fail=1
          fi
          [ "${fail}" -eq 0 ]

  verify:
    name: Verify
    runs-on: ubuntu-latest
    if: always()
    needs: [build-mac, build-ios, android-fast, android-device, lint, release-notes-smoke, version-consistency]
    steps:
      - name: Require every applicable check
        env:
          MAC_RESULT: ${{ needs.build-mac.result }}
          IOS_RESULT: ${{ needs.build-ios.result }}
          ANDROID_FAST_RESULT: ${{ needs.android-fast.result }}
          ANDROID_DEVICE_RESULT: ${{ needs.android-device.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          NOTES_RESULT: ${{ needs.release-notes-smoke.result }}
          VERSION_RESULT: ${{ needs.version-consistency.result }}
        run: |
          set -euo pipefail
          for result in "$MAC_RESULT" "$IOS_RESULT" "$ANDROID_FAST_RESULT" "$ANDROID_DEVICE_RESULT" "$LINT_RESULT" "$NOTES_RESULT"; do
            if [ "$result" != success ]; then
              echo "::error::Required CI job finished with $result"
              exit 1
            fi
          done
          if [[ "$GITHUB_REF" == refs/tags/V* ]]; then
            [ "$VERSION_RESULT" = success ]
          else
            [ "$VERSION_RESULT" = skipped ]
          fi
